name: iOS Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Build and test iOS app
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install iOS simulator runtime
        run: |
          xcodebuild -downloadPlatform iOS
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Create test simulator
        run: |
          RUNTIME_ID=$(xcrun simctl list runtimes -j | ruby -rjson -e '
            runtimes = JSON.parse(STDIN.read)["runtimes"]
            runtime = runtimes
              .select { |item| item["isAvailable"] && item["identifier"].include?("iOS") }
              .max_by { |item| item["version"] }

            abort("No available iOS Simulator runtime found") unless runtime
            puts runtime["identifier"]
          ')

          DEVICE_TYPE_ID=$(xcrun simctl list devicetypes -j | ruby -rjson -e '
            device_types = JSON.parse(STDIN.read)["devicetypes"]
            device = device_types.find { |item| item["name"] == "iPhone 17" }

            abort("iPhone 17 device type not found") unless device
            puts device["identifier"]
          ')

          SIMULATOR_UDID=$(xcrun simctl create "CI iPhone" "$DEVICE_TYPE_ID" "$RUNTIME_ID")

          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"

          echo "Created simulator:"
          xcrun simctl list devices | grep "$SIMULATOR_UDID"

      - name: Boot test simulator
        run: |
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Verify simulator destination
        run: |
          echo "Simulator UDID: $SIMULATOR_UDID"
          xcrun simctl list devices
          xcodebuild \
            -project IOS-Weather-App.xcodeproj \
            -scheme IOS-Weather-App \
            -showdestinations

      - name: Build and run all tests
        run: |
          xcodebuild test \
            -project IOS-Weather-App.xcodeproj \
            -scheme IOS-Weather-App \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: TestResults.xcresult